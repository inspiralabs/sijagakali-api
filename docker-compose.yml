# Deploy VPS Inspiralabs — pola multi-service (lihat server-setup/templates/README.md).
x-app: &app
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  init: true
  networks: [edge]

x-runtime: &runtime
  <<: *app
  build:
    context: .
    target: runtime
  image: sijagakali-api:runtime

services:
  api:
    <<: *runtime
    command: ["node", "api/dist/index.js"]
    environment:
      FASTIFY_PORT: "3100"
      GATEWAY_URL: http://notification-gateway:3101
      MQTT_BROKER_URL: mqtt://mosquitto:1883   # broker infra bersama (alias di network edge)
    expose: ["3100"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.sijagakali-api.rule=Host(`api-sijagakali.inspiralabs.id`) || Host(`api.sijagakali.id`)
      - traefik.http.services.sijagakali-api.loadbalancer.server.port=3100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mqtt-collector:
    <<: *runtime
    command: ["node", "mqtt-collector/dist/index.js"]
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883   # broker infra bersama (alias di network edge)
    healthcheck:
      disable: true

  data-processing:
    <<: *runtime
    command: ["node", "data-processing/dist/index.js"]
    environment:
      GATEWAY_URL: http://notification-gateway:3101
    healthcheck:
      disable: true

  notification-gateway:
    <<: *app
    build:
      context: .
      target: runtime-wa
    image: sijagakali-api:wa
    hostname: notification-gateway
    command: ["node", "notification-gateway/dist/index.js"]
    environment:
      GATEWAY_BIND: 0.0.0.0
      GATEWAY_HTTP_PORT: "3101"
      WA_SESSION_DIR: /data/wa
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - wa-session:/data/wa
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    networks: [edge]
    # image scratch tanpa shell/curl — tidak ada perintah healthcheck yang bisa dijalankan
    healthcheck:
      disable: true
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    expose: ["8888"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.sijagakali-cctv.rule=Host(`cctv-sijagakali.inspiralabs.id`) || Host(`cctv.sijagakali.id`)
      - traefik.http.services.sijagakali-cctv.loadbalancer.server.port=8888

volumes:
  wa-session:

networks:
  edge:
    external: true
